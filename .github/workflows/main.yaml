on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    tags: [v*]
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions: {}

jobs:
  nox: { uses: $/.github/workflows/nox.yaml }
  publish:
    needs: [nox]
    runs-on: ubuntu-26.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions: { id-token: write } # trusted publishing
    environment:
      name: pypi
      url: >-
        https://pypi.org/project/dotlocalslashbin/${{
          needs.nox.outputs.version }}/
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: artifact, path: dist }
      # yamllint disable-line rule:line-length
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # https://github.com/pypa/gh-action-pypi-publish/blob/release/v1/action.yml
        with: { print-hash: true }
  zizmor:
    runs-on: ubuntu-26.04
    # https://github.com/zizmorcore/zizmor-action#permissions
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # yamllint disable-line rule:line-length
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
